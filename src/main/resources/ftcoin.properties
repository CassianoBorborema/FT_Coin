# pt, en ou es; vazio: pergunta o idioma ao iniciar
idioma=

# auto: tenta o MariaDB e, se não conectar, usa memória | memoria: usa memória direto
persistencia=auto

db.url=jdbc:mariadb://localhost:3306/ftcoin
db.usuario=ftcoin
db.timeout=5

# compras a partir desta data debitam o saldo em reais da carteira; as anteriores, não
credito.vigencia=2026-10-14

# Oráculo: servidor de cotações. Endereço, grupo e senha reais ficam em ftcoin.local.properties (fora do Git).
oraculo.host=
oraculo.porta=1234
oraculo.grupo=
oraculo.senha=
