# Configuração do FT_Coin.
#
# Qualquer chave pode ser sobrescrita, em ordem de prioridade:
#   1. na execução:            java -Ddb.senha=segredo -jar ft-coin.jar
#   2. variável de ambiente:   FTCOIN_DB_SENHA=segredo  (FTCOIN_ + chave, "." vira "_")
#   3. arquivo local (fora do Git) ftcoin.local.properties no diretório de execução

# ---------------------------------------------------------------------------
# Persistência: memoria | mariadb
# ---------------------------------------------------------------------------
persistencia=memoria

# Conexão com o MariaDB (usada quando persistencia=mariadb).
# A senha não fica aqui: informe-a por FTCOIN_DB_SENHA, -Ddb.senha ou ftcoin.local.properties.
db.url=jdbc:mariadb://localhost:3306/ftcoin
db.usuario=ftcoin
# Tempo máximo, em segundos, para abrir a conexão.
db.timeout=5

# ---------------------------------------------------------------------------
# Oráculo simulado (fórmula da planilha de apuração de referência)
#
#   cotação(dia) = base + flutuação(dia) + valorização(dia)
#   valorização  = valorizacao.inicial + valorizacao.fator * ln(n)
#   n            = dias desde a data inicial (a data inicial é o dia 1)
#   flutuação    = sorteio entre -amplitude e +amplitude, fixo para cada data
# ---------------------------------------------------------------------------
oraculo.dataInicial=2026-01-01
oraculo.base=10.00
oraculo.flutuacao.amplitude=2.5
oraculo.valorizacao.inicial=1.40
oraculo.valorizacao.fator=0.435
oraculo.semente=2026
